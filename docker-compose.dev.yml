version: '3.8'
services:
  postgres:
    image: postgres:16-alpine
    env_file:
      - ./.env
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - '${REDIS_PORT:-6379}:6379'
    volumes:
      - redisdata:/data

volumes:
  pgdata:
  redisdata:
